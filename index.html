<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FCF3F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1016" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Miles">
  <title>Miles</title>
  <meta name="description" content="Pick the card that earns the most miles, and log what you paid.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <h1 id="title">Which card?</h1>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Screens">
    <a href="#which" data-screen="which">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18M7 14.5h4"/></svg>
      <span>Which card?</span>
    </a>
    <a href="#add" data-screen="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Add</span>
    </a>
    <a href="#overview" data-screen="overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>
      <span>Overview</span>
    </a>
    <a href="#history" data-screen="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>History</span>
    </a>
    <a href="#cards" data-screen="cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="13" height="9" rx="2"/><rect x="7" y="11" width="13" height="9" rx="2"/></svg>
      <span>My cards</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
