  <g transform="rotate(-8 256 256)">
    <rect x="150" y="150" width="232" height="148" rx="22" fill="#FCE1EB" opacity="0.55"/>
  </g>
  <rect x="130" y="196" width="252" height="160" rx="24" fill="#FFFFFF"/>
  <rect x="130" y="236" width="252" height="30" fill="#3B1D2A"/>
  <rect x="156" y="300" width="72" height="16" rx="8" fill="#C8326E"/>
</svg>
